# monitor=DP-1,2560x1440@60,2560x0,1
monitor=,highres,auto,1.25

# unscale XWayland
xwayland {
  force_zero_scaling = true
}

source = ~/.config/hypr/env.conf
source = ~/.config/hypr/keymap.conf
source = ~/.config/hypr/windowrule.conf
source = ~/.config/hypr/autostart.conf
source = ~/.config/hypr/animations.conf
source = ~/.config/hypr/cursor.conf

# 输入
input {
    kb_layout = us
    repeat_rate = 25
    repeat_delay = 600
    follow_mouse = 0
    numlock_by_default = true
    float_switch_override_focus = 1
    sensitivity = 0 # -1.0 - 1.0, 0 means no modification.
    touchpad {
        natural_scroll = false
    }
}

# 手势
gestures {
    workspace_swipe = true # 3指滑动
}

general {
    gaps_in = 5 # gaps between windows
    gaps_out = 10 # gaps between windows and monitor edges
    border_size = 2
    col.active_border = rgba(33ccffee) rgba(00ff99ee) 45deg
    col.inactive_border = rgba(595959aa)
    layout = dwindle
    resize_on_border = true
}

decoration {
    rounding = 12
    blur {
      enabled=true
      size = 8
      passes = 1
      new_optimizations = true
    }

    drop_shadow = true
    shadow_range = 4
    shadow_render_power = 3
    col.shadow = rgba(1a1a1aee)

    active_opacity = 1
    inactive_opacity = 0.6
    fullscreen_opacity = 1

    dim_inactive = false # 非活动窗口变暗
    dim_strength = 0.8
}

misc {
  always_follow_on_dnd = true
  disable_hyprland_logo = true
  key_press_enables_dpms = true # 如果 DPMS 设置为关闭，则按下某个键即可唤醒监视器。
  new_window_takes_over_fullscreen = 2 # 全屏下新窗口改为默认模式
}

dwindle {
    # pseudotile = true # master switch for pseudotiling. Enabling is bound to Mod 
    # preserve_split = true # you probably want this
    force_split = 2 # 右侧拆分
}

master {
    new_status = master
}



