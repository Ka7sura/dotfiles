$Mod    =   SUPER
$Mod1   =   SUPER_SHIFT
$term   =   kitty
$fm     =   qtfm

bindd = $Mod,   R,      启动器,             exec,               wofi #exec, rofi -show drun
bindd = $Mod1,  return, 终端模拟器,         exec,               $term
bindd = $Mod1,  C,      杀死window,         killactive,
bindd = $Mod1,  Q,      退出Hyprland,       exit,
bindd = $Mod,   Q,      重新渲染Hyprland,   forcerendererreload,
bindd = $Mod1,  S,      截图,               exec,               grim -g "$(slurp)" - | wl-copy
bindd = $Mod1,  v,      剪贴板,             exec,               copyq menu
bindd = $Mod,   l,      锁屏,               exec,               swaylock -c 000000 -ef
bindd = $Mod,   E,      文件管理器,         exec,               $fm
bindd = $Mod1,  T,      切换副屏,           exec,               ~/.scripts/toggleScreen.sh
bindd = $Mod1,  tab,    基于wofi的窗口选择, exec,               ~/.scripts/wofi_switchwindow.sh
bindd = $Mod,   return, 浮动终端,           exec,               [floating] $term


## window manager
bindd = $Mod,   V,      toogle 浮动,    togglefloating,
bindd = $Mod,   P,      固定浮动窗口,   pin
bindd = $Mod,   C,      居中浮动窗口,   centerwindow,       1
bindd = $Mod,   F,      全屏带bar,      fullscreen,         1
bindd = $Mod1,  F,      真全屏,         fullscreen,         0
bindd = $Mod,   tab,    切换最近的窗口, focusurgentorlast
# master
# bind = $Mod, J, layoutmsg, cyclenext
# bind = $Mod, K, layoutmsg, cycleprev
# dwindle
bindd = $Mod1,  P,      伪平铺,         pseudo,                 # 窗口保持浮动大小
bindd = $Mod,   a,      切换窗口分割,   togglesplit,

# 焦点切换
bindd = $Mod,   h,      焦点移动-左,    movefocus,          l
bindd = $Mod,   J,      焦点移动-下,    movefocus,          d
bindd = $Mod,   K,      焦点移动-上,    movefocus,          u
# bindd = $Mod,   l,      焦点移动-右,    movefocus,          r # 锁屏冲突
bindd = $Mod,   left,   焦点移动-左,    movefocus,          l
bindd = $Mod,   down,   焦点移动-下,    movefocus,          d
bindd = $Mod,   up,     焦点移动-上,    movefocus,          u
bindd = $Mod,   right,  焦点移动-右,    movefocus,          r

# 窗口切换
bindd = $Mod,   n,      向后切换窗口,   swapnext,
bindd = $Mod1,  H,      交换窗口-左,    swapwindow,         l
bindd = $Mod1,  J,      交换窗口-下,    swapwindow,         d
bindd = $Mod1,  K,      交换窗口-右,    swapwindow,         u
bindd = $Mod1,  L,      交换窗口-上,    swapwindow,         r

## 工作区切换
# 简单切换
bindd = $Mod,       mouse_up,   鼠标滚轮切换到右侧工作区,   workspace,  e+1
bindd = $Mod,       mouse_down, 鼠标滚轮切换到左侧工作区,   workspace,  e-1
bindd = $Mod CTRL,  right,      切换到右侧工作区,           workspace,  e+1
bindd = $Mod CTRL,  left,       切换到左侧工作区,           workspace,  e-1
# 精准切换
bind = $Mod, 1, workspace, 1
bind = $Mod, 2, workspace, 2
bind = $Mod, 3, workspace, 3
bind = $Mod, 4, workspace, 4
bind = $Mod, 5, workspace, 5
bind = $Mod, 6, workspace, 6
bind = $Mod, 7, workspace, 7
bind = $Mod, 8, workspace, 8
bind = $Mod, 9, workspace, 9
bind = $Mod, 0, workspace, 10
# 窗口静默加入到工作区
bind = $Mod SHIFT, 1, movetoworkspacesilent, 1
bind = $Mod SHIFT, 2, movetoworkspacesilent, 2
bind = $Mod SHIFT, 3, movetoworkspacesilent, 3
bind = $Mod SHIFT, 4, movetoworkspacesilent, 4
bind = $Mod SHIFT, 5, movetoworkspacesilent, 5
bind = $Mod SHIFT, 6, movetoworkspacesilent, 6
bind = $Mod SHIFT, 7, movetoworkspacesilent, 7
bind = $Mod SHIFT, 8, movetoworkspacesilent, 8
bind = $Mod SHIFT, 9, movetoworkspacesilent, 9
bind = $Mod SHIFT, 0, movetoworkspacesilent, 10


# Move/resize windows with Mod + LMB/RMB and dragging
bindm = $Mod, mouse:272, movewindow
bindm = $Mod, mouse:273, resizewindow

# fn buttons
bindd =,XF86AudioMute,          F1, exec,   wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindd =,XF86AudioLowerVolume,   F2, exec,   wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bindd =,XF86AudioRaiseVolume,   F3, exec,   wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%+
bindd =,XF86AudioMicMute,       F4, exec,   wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle
bindd =,XF86MonBrightnessDown,  F5, exec,   brightnessctl s 5%-
bindd =,XF86MonBrightnessUp,    F6, exec,   brightnessctl s 5%+
# bindd =,XF86AudioPlay,          F7, exec,   playerctl play-pause
# bindd =,XF86AudioPrev,          F8, exec,   playerctl previous
# bindd =,XF86AudioNext,          F9, exec,   playerctl next

# resize submap (mode)
bind=SUPER SHIFT,R,submap,resize
submap=resize
binde=,L,resizeactive,50 0
binde=,H,resizeactive,-50 0
binde=,K,resizeactive,0 -50
binde=,J,resizeactive,0 50
binde=,right,resizeactive,10 0
binde=,left,resizeactive,-10 0
binde=,up,resizeactive,0 -10
binde=,down,resizeactive,0 10
bind=,escape,submap,reset
bind=,Return,submap,reset
bind = , catchall, submap, reset
submap=reset
